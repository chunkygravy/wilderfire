name: Build WilderFire
on:
  push:
    branches: [main, 'fix/**', 'feature/**', 'ui/**', 'perf/**', 'release/**']
  pull_request:
    branches: [main, 'feature/github-pages']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: wilderfire-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
